name: "Perf Test - IOC Flood 5K"
description: |
  Floods the proxy with 5 000 IOC LIMIT orders/sec.
  Measures proxy throughput ceiling and latency distribution.
  The price is set well below the market, so every order cancels immediately
  (no fills — clean IOC round-trip: send → NEW → CANCELLED).

steps:
  - type: perf_test
    mode: ioc
    symbol: AAPL
    side: BUY
    qty: 100
    price: 1.00
    rate: 5000
    totalOrders: 25000
    warmupOrders: 500
    reportIntervalSec: 2
    ackTimeoutMs: 60000
