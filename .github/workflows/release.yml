# Release the FIX test harness when a tag named testharness-rN.M.L is pushed to main.
#
# Example: git tag testharness-r1.2.3 && git push origin testharness-r1.2.3
#
# The tag must point to a commit that is on main. The release holds the image as a tarball,
# the fat jar, and the scenarios.
name: Release testharness

on:
  push:
    tags:
      - 'testharness-r*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag name
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^testharness-r([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$tag' does not match testharness-rN.M.L" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main; no release." >&2
            exit 1
          fi

      - name: Build the image
        run: ./build.sh --tag "fix-testharness:${{ steps.version.outputs.version }}"

      - name: Package the image, the jar and the scenarios
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          docker save "fix-testharness:${v}" | gzip > "dist/fix-testharness-${v}.image.tar.gz"
          cid=$(docker create "fix-testharness:${v}")
          docker cp "${cid}:/app/app.jar" "dist/fix-testharness-${v}.jar"
          docker rm "$cid" >/dev/null
          tar -czf "dist/fix-testharness-${v}-scenarios.tar.gz" scenarios config
          tar -czf "dist/fix-testharness-${v}-tools.tar.gz" play_scenario.sh sync_seqnums.sh
          cp release/DEPLOY.md dist/DEPLOY.md
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "FIX test harness ${{ steps.version.outputs.version }}" \
            --notes-file release/DEPLOY.md \
            --verify-tag
