# ─────────────────────────────────────────────────────────────────────────────
# QuickFIX/J FIX Test Harness – client (initiator) configuration
# ─────────────────────────────────────────────────────────────────────────────
# Docs: https://quickfixj.org/usermanual/2.3.0/usage/configuration.html
# ─────────────────────────────────────────────────────────────────────────────

[DEFAULT]
ConnectionType=initiator

# Heartbeat interval (seconds) — keeps the session alive between scenario steps
HeartBtInt=30

# Session times (00:00:00 = always active)
StartTime=00:00:00
EndTime=00:00:00

# Reset sequences on logon for a clean test run
ResetOnLogon=Y
ResetOnLogout=N
ResetOnDisconnect=N

# Message store and logs
FileStorePath=store
FileLogPath=logs

# FIX 4.4 data dictionary (shipped inside quickfixj-messages-fix44.jar)
UseDataDictionary=Y
DataDictionary=FIX44.xml

# Validation
ValidateUserDefinedFields=N
ValidateIncomingMessage=Y
ValidateChecksum=Y

# Reconnect after disconnect (seconds)
ReconnectInterval=5

[SESSION]
BeginString=FIX.4.4
SenderCompID=TESTCLIENT
TargetCompID=EXCHANGE
SocketConnectHost=localhost
SocketConnectPort=9876
