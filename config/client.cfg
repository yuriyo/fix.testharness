# ─────────────────────────────────────────────────────────────────────────────
# QuickFIX/J FIX Test Harness – client (initiator) configuration
# ─────────────────────────────────────────────────────────────────────────────
# Docs: https://quickfixj.org/usermanual/2.3.0/usage/configuration.html
# ─────────────────────────────────────────────────────────────────────────────

[DEFAULT]
ConnectionType=initiator

# Heartbeat interval (seconds) — keeps the session alive between scenario steps
HeartBtInt=30

# Session times (00:00:00 = always active)
StartTime=00:00:00
EndTime=00:00:00

# Reset sequences on logon for a clean test run
# NOTE: proxy rejects Logon messages with ResetSeqNumFlag=Y (tag 141)
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N

# Message store and logs
FileStorePath=store
FileLogPath=logs

# FIX 4.2 data dictionary (shipped inside quickfixj-messages-fix42.jar)
UseDataDictionary=Y
DataDictionary=FIX42.xml

# Validation
ValidateUserDefinedFields=N
ValidateIncomingMessage=Y
ValidateChecksum=Y

# Reconnect after disconnect (seconds)
ReconnectInterval=5

[SESSION]
BeginString=FIX.4.2
SenderCompID=YOYO
TargetCompID=SIM
SocketConnectHost=qm79.dev.domain
SocketConnectPort=5005
